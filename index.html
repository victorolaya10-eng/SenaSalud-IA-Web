<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SeñaSalud IA</title>\n<meta name="theme-color" content="#064B7B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SeñaSalud IA">

<style>
:root{
 --navy:#064B7B;--navy2:#0A6393;--teal:#10B7B5;--teal2:#20C7C2;
 --coral:#F36A5E;--ink:#173B55;--muted:#6D8291;--bg:#F4F8FA;
 --white:#fff;--line:#E1EBF0;--green:#21B990;--amber:#F3A33A;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
body{background:linear-gradient(#F7FAFB,#F1F7F9)}
.app{min-height:100vh}.shell{width:min(480px,100%);min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 35px #064B7B10}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,#064B7B 0%,#0A6393 55%,#10B7B5 100%)}
.login-card{width:min(420px,100%);background:white;border-radius:30px;padding:28px 22px 24px;box-shadow:0 25px 70px #001f3535;position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;right:-70px;top:-75px;width:190px;height:140px;background:#10B7B522;border-radius:50%}
.brand-logo{display:block;width:min(340px,92%);height:auto;margin:4px auto 10px;object-fit:contain}
.welcome{text-align:center;color:var(--ink);font-size:27px;font-weight:800;margin:5px 0 7px}
.login-copy{text-align:center;color:var(--muted);line-height:1.45;margin:0 auto 20px;max-width:320px}
.field{height:50px;border:1px solid var(--line);border-radius:15px;display:flex;align-items:center;gap:10px;padding:0 15px;background:#fff;margin:10px 0}
.field span{color:var(--muted)}.field input{border:0;outline:0;width:100%;color:var(--ink);background:transparent}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn:active{transform:scale(.98)}.primary{background:var(--navy);color:#fff;box-shadow:0 8px 18px #064B7B25}
.teal{background:var(--teal);color:#fff}.outline{background:#fff;color:var(--navy);border:1px solid #9FC2D5}
.full{width:100%}.divider{display:flex;align-items:center;gap:10px;color:#98A8B2;margin:16px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.topbar{height:82px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-radius:0 0 22px 22px}
.top-left{display:flex;align-items:center;gap:10px}.back{border:0;background:transparent;color:#fff;font-size:25px;padding:4px}.top-title{font-size:18px;font-weight:800}.top-sub{font-size:12px;opacity:.78;margin-top:2px}
.icon{border:0;background:#ffffff18;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px}
.content{padding:17px 16px 100px;min-height:calc(100vh - 82px)}
.greeting{margin:4px 2px 15px}.greeting h1{font-size:26px;margin:0;color:var(--ink)}.greeting p{margin:3px 0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 7px 20px #064B7B0B;padding:15px;margin-bottom:13px}
.next-card{background:linear-gradient(135deg,#fff,#F0FAFA);border-left:4px solid var(--teal);display:flex;gap:13px;align-items:flex-start}
.date-box{width:58px;min-width:58px;border-radius:14px;background:#E7F7F7;text-align:center;padding:8px 4px;color:var(--navy);font-weight:800}
.date-box small{display:block;color:var(--teal);font-size:10px}.date-box strong{font-size:22px;display:block}
.card-title{font-weight:800;color:var(--ink);margin-bottom:4px}.muted{color:var(--muted);font-size:13px;line-height:1.45}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800;margin-top:7px}
.badge.green{background:#DDF8EF;color:#15936F}.badge.amber{background:#FFF0D8;color:#AF6A09}.badge.coral{background:#FFE4E1;color:#C94D43}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}.section-head h3{margin:0;font-size:17px}.link{border:0;background:none;color:var(--navy2);font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.feature{min-height:124px;padding:15px;position:relative;overflow:hidden;cursor:pointer}
.feature .fi{font-size:29px;width:49px;height:49px;border-radius:15px;display:grid;place-items:center;margin-bottom:25px}
.feature h4{margin:0;font-size:14px}.feature p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.feature.blue{background:#EAF5FB}.feature.blue .fi{background:#D4ECF8}.feature.tealF{background:#E8FAF8}.feature.tealF .fi{background:#D2F5F2}.feature.coralF{background:#FFF0EE}.feature.coralF .fi{background:#FFE0DC}.feature.lav{background:#EEF3FF}.feature.lav .fi{background:#DDE7FF}
.feature:after{content:"›";position:absolute;right:13px;top:14px;font-size:22px;color:#5A8198}
.banner{background:linear-gradient(115deg,#07527F,#10B7B5);color:#fff;border-radius:19px;padding:17px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;margin-top:14px}
.banner h3{margin:0;font-size:16px;max-width:210px}.banner p{margin:5px 0 0;font-size:11px;opacity:.9}.play{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:17px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;box-shadow:0 -7px 20px #064B7B0C}
.nav{border:0;background:#fff;color:#78909F;font-size:10px}.nav .ni{width:34px;height:30px;margin:5px auto 2px;display:grid;place-items:center;border-radius:10px;font-size:20px}.nav.active{color:var(--navy);font-weight:800}.nav.active .ni{background:#E5F5F7;color:var(--teal)}
.segment{display:grid;grid-template-columns:1fr 1fr;background:#EAF1F5;border-radius:18px;padding:4px;margin-bottom:13px}.segment button{border:0;background:transparent;padding:10px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:800}.segment button.active{background:var(--navy);color:#fff}
.appointment{padding:15px}.appt-top{display:flex;gap:12px}.appt-icon{width:47px;height:47px;border-radius:14px;background:#E9F5FB;display:grid;place-items:center;font-size:22px}.appt-actions{display:flex;gap:8px;margin-top:12px}.small-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:8px 10px;font-size:11px;font-weight:800;flex:1}
.big-action{width:100%;margin-top:4px}.chat-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.chat-tab{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 6px;text-align:center;color:var(--navy);font-size:11px;font-weight:800}.chat-tab.active{background:var(--navy);color:#fff}
.communication-options{display:flex;flex-direction:column;gap:13px;margin-top:4px}.communication-option{width:100%;border:1px solid var(--line);background:#fff;border-radius:21px;padding:18px;display:flex;align-items:center;gap:15px;text-align:left;box-shadow:0 7px 20px #064B7B0B;transition:.18s}.communication-option:active{transform:scale(.985)}.communication-option .option-icon{width:58px;height:58px;min-width:58px;border-radius:17px;display:grid;place-items:center;font-size:28px}.communication-option h3{margin:0 0 4px;font-size:15px;color:var(--ink)}.communication-option p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.communication-option .option-arrow{margin-left:auto;color:var(--navy);font-size:25px}.option-video .option-icon{background:#EAF5FB}.option-chat .option-icon{background:#E8FAF8}.option-lsc .option-icon{background:#FFF0EE}
.source-link{display:inline-block;margin-top:9px;color:var(--teal);font-size:11px;font-weight:800;text-decoration:none}.source-link:hover{text-decoration:underline}
.layer-header{display:flex;align-items:center;gap:10px;margin:0 0 13px}.layer-back{border:0;background:#E9F5F8;color:var(--navy);width:38px;height:38px;border-radius:12px;font-size:21px}.layer-kicker{font-size:11px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.4px}.layer-title{font-size:19px;font-weight:800;color:var(--ink);margin-top:1px}
.message{display:flex;gap:9px;margin:12px 0}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 13px;border-radius:17px;background:#F0F4F6;font-size:13px;line-height:1.4}.user .bubble{background:#DDF4F5}.bot-avatar{width:35px;height:35px;border-radius:50%;background:#E4F6F7;display:grid;place-items:center}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.quick{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 5px;text-align:center;color:var(--navy);font-size:10px;font-weight:800}
.chat-input{display:flex;gap:8px;margin-top:15px}.chat-input input{flex:1;border:1px solid var(--line);border-radius:20px;padding:11px 14px;outline:0}.send{width:45px;border:0;border-radius:50%;background:var(--teal);color:#fff}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;font-size:11px;font-weight:800;color:var(--muted)}.filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.result{display:flex;gap:12px;align-items:center;padding:13px 2px}.result+.result{border-top:1px solid var(--line)}.result-icon{width:47px;height:47px;border-radius:14px;background:#EAF6FA;display:grid;place-items:center;font-size:22px}.result-arrow{margin-left:auto;color:var(--navy);font-size:20px}.info{background:#E9F6FC;color:#23719A;font-size:11px;line-height:1.45}
.profile-head{display:flex;gap:13px;align-items:center}.avatar-big{width:70px;height:70px;border-radius:22px;background:linear-gradient(145deg,#D9F4F4,#E7F1FB);display:grid;place-items:center;font-size:42px}.edit{margin-left:auto;border:0;background:#E9F5F8;color:var(--navy);border-radius:11px;padding:8px 11px}.profile-row{display:flex;align-items:center;gap:12px;padding:14px 3px;border-bottom:1px solid var(--line);font-size:13px}.profile-row:last-child{border-bottom:0}.row-icon{width:31px;color:var(--navy);font-size:18px}.row-arrow{margin-left:auto;color:#8AA0AE}
.triage-hero{background:linear-gradient(135deg,#E6FAF9,#EAF5FB);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center}.triage-person{width:110px;height:130px;border-radius:17px;background:linear-gradient(160deg,#BEEEEE,#DDEFF9);display:grid;place-items:center;font-size:68px}.triage-hero h3{margin:0;font-size:15px;color:var(--navy)}.triage-hero p{font-size:11px;line-height:1.45;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.step{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 7px;text-align:center;font-size:10px}.step-num{width:25px;height:25px;border-radius:50%;background:#E5F5F7;color:var(--navy);display:grid;place-items:center;margin:0 auto 7px;font-weight:800}.camera{height:300px;border-radius:21px;background:linear-gradient(160deg,#173443,#101E27);color:#fff;display:grid;place-items:center;text-align:center;font-size:18px;position:relative;overflow:hidden}.camera-person{font-size:100px}.record{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#F04F4A;box-shadow:0 0 0 6px #F04F4A55;position:absolute;bottom:17px;left:50%;transform:translateX(-50%)}.record.stop{background:#fff}.triage-result{background:#fff;border-radius:19px;padding:16px;border:1px solid var(--line)}.recommend{background:#EAF5FB;border-radius:16px;padding:13px;display:flex;gap:10px}.recommend-icon{font-size:25px}.warning{background:#FFF4D9;color:#8B641D;border-radius:13px;padding:12px;font-size:11px;line-height:1.45;margin-top:12px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#173443;color:#fff;padding:11px 16px;border-radius:13px;z-index:50;box-shadow:0 8px 25px #0004;font-size:12px;max-width:90%;text-align:center}
@media(min-width:800px){body{padding:20px}.shell{border-radius:25px;min-height:calc(100vh - 40px);overflow:hidden}.topbar{border-radius:0}.bottom{bottom:20px;border-radius:0 0 25px 25px}}

.video-card{padding:10px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 20px #064B7B0B}
.video-wrap{position:relative;border-radius:16px;overflow:hidden;background:#102631;aspect-ratio:16/10}
.video-wrap video,.video-wrap iframe{width:100%;height:100%;border:0;display:block;object-fit:cover}
.video-caption{background:#173443;color:#fff;padding:12px 13px;font-size:12px;line-height:1.45}
.live-dot{display:inline-block;width:8px;height:8px;background:#F36A5E;border-radius:50%;margin-right:5px}
.video-tools{display:flex;gap:8px;margin-top:10px}.video-tools button{flex:1}
.subtitle-box{position:absolute;left:8%;right:8%;bottom:14px;background:#000c;color:#fff;border-radius:9px;padding:8px 11px;text-align:center;font-size:13px;font-weight:700;z-index:3;pointer-events:none}
.doctor-card{display:flex;align-items:center;gap:12px;padding:13px;background:#F1F8FA;border-radius:16px;margin-bottom:12px}
.doctor-avatar{width:52px;height:52px;border-radius:16px;background:#D9F1F6;display:grid;place-items:center;font-size:29px}
.call-status{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:11px;color:var(--muted)}
.call-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.call-action{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 5px;font-size:10px;color:var(--navy);font-weight:800}.call-action.end{background:#FFE7E4;color:#C64C43}
.source-note{font-size:10px;color:var(--muted);line-height:1.4;margin-top:9px}
</style>
</head>

<script>
(function(){
  function attachLocalLSCVideo() {
    const v = document.getElementById('lscVideo');
    if (!v || v.dataset.localReady === '1') return;
    v.dataset.localReady = '1';
    v.src = 'video_interprete_lsc.mp4';
    v.load();
    v.addEventListener('error', function() {
      const note = document.getElementById('lscVideoNote');
      if (note) note.textContent = 'No se pudo cargar el video local. Cierra y vuelve a abrir la app; si persiste, revisa que video_interprete_lsc.mp4 esté incluido en assets/web.';
    });
  }
  // La pantalla LSC se crea dinámicamente al seleccionarla, así que la inicialización
  // se repite cuando la pantalla aparece.
  const observer = new MutationObserver(function() { attachLocalLSCVideo(); });
  observer.observe(document.documentElement, {childList:true, subtree:true});
  document.addEventListener('DOMContentLoaded', attachLocalLSCVideo);
  document.addEventListener('click', function() { setTimeout(attachLocalLSCVideo, 0); }, true);
  attachLocalLSCVideo();
})();
</script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(window.location.protocol==='file:'){
    document.querySelectorAll('.video-wrap iframe').forEach(function(el){el.style.display='none';});
  }
});
</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((err) => {
      console.warn('No se pudo registrar el modo PWA:', err);
    });
  });
}
</script>
